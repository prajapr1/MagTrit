<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Videos</title>
</head>
<body style="font-family: sans-serif; padding: 20px;">

  <h1 style="max-width: 800px; margin: 0 auto 20px;">My Video Reference</h1>

  <!-- Container where all stacked videos will appear -->
  <div id="youtube-gallery" style="max-width: 800px; margin: 0 auto;"></div>

  <script>
    // 1. Paste your full YouTube links inside the quotes, separated by commas
    const videoUrls = [
      "https://youtu.be",
      "https://youtube.com"
    ];

    // Extracts the 11-character Video ID from any YouTube link
    function getYouTubeId(url) {
      const match = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|v\/|shorts\/))([^&?\/]+)/);
      return match ? match[1] : null;
    }

    // Builds a stacked, responsive player for each video
    const gallery = document.getElementById("youtube-gallery");

    videoUrls.forEach(url => {
      const id = getYouTubeId(url);
      if (!id) return;

      const wrapper = document.createElement("div");
      wrapper.style.cssText = "position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; max-width: 100%; margin-bottom: 24px;";

      wrapper.innerHTML = `
        <iframe 
          src="https://youtube.com{id}" 
          title="YouTube video player" 
          style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0;" 
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
          allowfullscreen>
        </iframe>
      `;

      gallery.appendChild(wrapper);
    });
  </script>

</body>
</html>
