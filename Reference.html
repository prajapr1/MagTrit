<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Reference</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0f0f0f;
      color: #f1f1f1;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 24px;
    }

    #top-bar {
      max-width: 1400px;
      margin: 0 auto 20px auto;
      display: none;
    }

    #back-btn {
      background-color: #272727;
      color: #f1f1f1;
      border: none;
      padding: 10px 18px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }

    #back-btn:hover {
      background-color: #3f3f3f;
    }

    #app {
      max-width: 1400px;
      margin: 0 auto;
    }

    /* GRID VIEW: 3 videos per row */
    .grid-layout #video-list {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
    }

    /* WATCH VIEW: Active player on left, remaining videos on right */
    .watch-layout {
      display: grid;
      grid-template-columns: 1fr 380px;
      gap: 24px;
      align-items: start;
    }

    #player-section {
      display: none;
    }

    .watch-layout #player-section {
      display: block;
    }

    .video-frame-wrapper {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
      overflow: hidden;
      border-radius: 12px;
      background: #000;
    }

    .video-frame-wrapper iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    #active-title {
      margin-top: 16px;
      font-size: 20px;
      font-weight: 600;
      line-height: 1.4;
      color: #ffffff;
    }

    .watch-layout #video-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .video-card {
      cursor: pointer;
      border-radius: 12px;
      transition: transform 0.15s ease;
    }

    .video-card:hover .thumb-wrapper img {
      transform: scale(1.03);
    }

    .watch-layout .video-card {
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }

    .watch-layout .video-card.active-card {
      background-color: #1f1f1f;
      padding: 6px;
      border-radius: 10px;
    }

    .thumb-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: 12px;
      overflow: hidden;
      background-color: #1e1e1e;
    }

    .watch-layout .thumb-wrapper {
      width: 160px;
      min-width: 160px;
      border-radius: 8px;
    }

    .thumb-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.2s ease;
    }

    .video-title {
      margin-top: 10px;
      font-size: 15px;
      font-weight: 500;
      line-height: 1.4;
      color: #f1f1f1;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .watch-layout .video-title {
      margin-top: 2px;
      font-size: 14px;
    }

    @media (max-width: 1024px) {
      .grid-layout #video-list {
        grid-template-columns: repeat(2, 1fr);
      }
      .watch-layout {
        grid-template-columns: 1fr;
      }
      .watch-layout .thumb-wrapper {
        width: 180px;
        min-width: 180px;
      }
    }

    @media (max-width: 640px) {
      .grid-layout #video-list {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <div id="top-bar">
    <button id="back-btn">← Back to All Videos</button>
  </div>

  <div id="app" class="grid-layout">
    <div id="player-section">
      <div class="video-frame-wrapper">
        <iframe 
          id="main-player" 
          src="" 
          title="YouTube video player" 
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
          allowfullscreen>
        </iframe>
      </div>
      <h2 id="active-title"></h2>
    </div>

    <div id="video-list"></div>
  </div>

  <script>
    // ============================================================
    // 1. PASTE YOUR YOUTUBE LINKS HERE (One per line, inside quotes)
    // ============================================================
    const videoLinks = [
      "https://youtu.be/sWKyrAXxzGA?si=4URl1k4KQjhkOU2h",
      "https://youtu.be/3aewaff1494?si=6QExc0D73Q4gD2Uw",
      "https://youtu.be/ln0zZcQXv38?si=iCweGBflti-H-YvS",
      "https://youtu.be/UWMEKex6nYA?si=H8JL0eJ6JxuYVI08"
    ];
    // ============================================================

    const app = document.getElementById("app");
    const topBar = document.getElementById("top-bar");
    const backBtn = document.getElementById("back-btn");
    const mainPlayer = document.getElementById("main-player");
    const activeTitle = document.getElementById("active-title");
    const videoList = document.getElementById("video-list");

    let videosData = [];

    function getYouTubeId(url) {
      const match = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|v\/|shorts\/))([^&?\/]+)/);
      return match ? match[1] : null;
    }

    async function fetchVideoTitle(id) {
      try {
        const oembedUrl = "https://youtube.com" + id + "&format=json";
        const res = await fetch(oembedUrl);
        if (!res.ok) throw new Error("Title fetch failed");
        const data = await res.json();
        return data.title;
      } catch (e) {
        return "YouTube Video";
      }
    }

    function playVideo(index) {
      const video = videosData[index];
      if (!video) return;

      app.className = "watch-layout";
      topBar.style.display = "block";
      mainPlayer.src = "https://youtube.com" + video.id + "?autoplay=1";
      activeTitle.textContent = video.title;

      document.querySelectorAll(".video-card").forEach((card, i) => {
        card.classList.toggle("active-card", i === index);
      });

      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    backBtn.addEventListener("click", () => {
      app.className = "grid-layout";
      topBar.style.display = "none";
      mainPlayer.src = "";
      document.querySelectorAll(".video-card").forEach(card => card.classList.remove("active-card"));
    });

    async function init() {
      const ids = videoLinks.map(getYouTubeId).filter(Boolean);

      videosData = await Promise.all(
        ids.map(async (id) => ({
          id,
          title: await fetchVideoTitle(id)
        }))
      );

      videosData.forEach((video, index) => {
        const card = document.createElement("div");
        card.className = "video-card";
        const thumbUrl = "https://ytimg.com" + video.id + "/hqdefault.jpg";

        card.innerHTML =
          '<div class="thumb-wrapper">' +
            '<img src="' + thumbUrl + '" alt="' + video.title + '" loading="lazy">' +
          '</div>' +
          '<div class="video-title">' + video.title + '</div>';

        card.addEventListener("click", () => playVideo(index));
        videoList.appendChild(card);
      });
    }

    init();
  </script>


</body>
</html>
